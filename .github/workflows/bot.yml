name: Eitaa News Bot

on:
  schedule:
    - cron: '0 */3 * * *' # اجرا هر ۳ ساعت یک‌بار (۸ بار در روز)؛ جمع‌بندی روزانه خودش در ران حدود ساعت ۲۱:۳۰ تهران ارسال می‌شود
  workflow_dispatch:      # امکان اجرای دستی

permissions:
  contents: write         # مجوز ذخیره خودکار فایل‌های seen.json و posts_log.json در گیت‌هاب

# جلوگیری از اجرای هم‌زمان (مثلاً دستی + زمان‌بندی‌شده) که باعث تداخل در push فایل‌ها می‌شود
concurrency:
  group: eitaa-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests pydantic google-genai trafilatura

      - name: Run news bot
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          # اختیاری: چت خصوصی برای گزارش و هشدار خطا (اگر secret تعریف نشود، گزارش ارسال نمی‌شود)
          ALERT_CHAT: ${{ secrets.ALERT_CHAT }}
          # برای خاموش کردن جمع‌بندی روزانه، خط زیر را از کامنت دربیاور:
          # DIGEST: 'off'
        run: python bot.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in seen.json posts_log.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update bot state [skip ci]" && git push)