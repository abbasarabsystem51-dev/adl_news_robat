name: Eitaa News Bot

on:
  schedule:
    - cron: '0 */4 * * *' # اجرا هر ۴ ساعت یک‌بار
  workflow_dispatch:      # امکان اجرای دستی

permissions:
  contents: write         # مجوز ذخیره خودکار فایل seen.json در گیت‌هاب

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests pydantic google-genai

      - name: Run news bot
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
        run: python bot.py

      - name: Commit and push updated seen.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen.json [skip ci]" && git push)
