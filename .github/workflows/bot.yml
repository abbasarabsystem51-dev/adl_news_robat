name: Adl News Eitaa Bot

on:
  schedule:
    # اجرا به صورت خودکار هر ۴ ساعت یک‌بار
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کدهای مخزن (Checkout)
        uses: actions/checkout@v4

      - name: نصب پایتون و کش کردن کتابخانه‌ها
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: نصب کتابخانه‌های مورد نیاز
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: اجرای ربات خبری-تحلیلی
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
        run: python bot.py

      - name: به‌روزرسانی امن فایل seen.json در مخزن
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update seen.json [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master
            git push
          else
            echo "هیچ تغییری در seen.json ایجاد نشده است."
          fi
